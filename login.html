<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — PixelPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="brand-mark"></span>PixelPulse<span class="sub">.mc</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="addons.html">Addons</a>
      <a href="changelogs.html">Changelog</a>
      <a href="announcements.html">Announcements</a>
      <a href="admin.html" class="staff-link hidden">Staff Panel</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
  </div>
</nav>

<div class="auth-shell">
  <div class="form-card notched">
    <h1>Log in</h1>
    <p style="margin-bottom:24px;">Welcome back to PixelPulse.</p>
    <div id="login-msg" class="form-msg error hidden"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="li-email">Email</label>
        <input type="email" id="li-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="li-password">Password</label>
        <input type="password" id="li-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <div class="switch">No account yet? <a href="signup.html">Sign up</a></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <span class="brand"><span class="brand-mark"></span>PixelPulse<span class="sub">.mc</span></span>
    <span class="fine">Fan-made Bedrock add-ons &amp; DLC. Not affiliated with Mojang or Microsoft.</span>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
